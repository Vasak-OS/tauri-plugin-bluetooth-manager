[package]
name = "tauri-plugin-bluetooth-manager"
version = "2.2.1"
authors = [ "Joaquin (Pato) Decima <jdecima@vasak.net.ar>", "Vasak Group" ]
description = "A Tauri plugin to manage Bluetooth adapters and devices in Linux."
edition = "2021"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-bluetooth-manager"
license = "GPL-3.0-or-later"

[dependencies]
tauri = { version = "2" }
zbus = "4"
zbus_macros = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "7"
thiserror = "2"
# Sólo para esperar el final de la ventana del freno (`throttle.rs`). Ya viene
# con tauri; esto pide la característica `time`, no otra copia.
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
